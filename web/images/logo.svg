<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f5f5f5" stroke="#2d7a4f" stroke-width="2"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#4caf50" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Shield base (security) -->
  <path d="M 100 40 L 140 60 L 140 90 Q 100 130 100 130 Q 100 130 60 90 L 60 60 Z" 
        fill="none" stroke="#2d7a4f" stroke-width="2.5"/>
  
  <!-- Shield design elements -->
  <circle cx="100" cy="85" r="12" fill="#4caf50"/>
  <rect x="93" y="95" width="14" height="20" fill="none" stroke="#2d7a4f" stroke-width="1.5" rx="2"/>
  
  <!-- Horizontal lines (building/institution) -->
  <line x1="80" y1="110" x2="120" y2="110" stroke="#2d7a4f" stroke-width="1.5" opacity="0.5"/>
  <line x1="80" y1="118" x2="120" y2="118" stroke="#2d7a4f" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Growth indicator (arrow up) -->
  <path d="M 130 125 L 135 115 L 140 125" fill="none" stroke="#4caf50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text -->
  <text x="100" y="155" font-size="10" font-weight="bold" text-anchor="middle" fill="#2d7a4f">BASOTHO</text>
  <text x="100" y="168" font-size="8" text-anchor="middle" fill="#4caf50">OWNERSHIP BANK</text>
</svg>
