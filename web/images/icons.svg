<!-- Basotho Ownership Bank - SVG Icons Library -->
<!-- Use: <svg class="icon"><use xlink:href="/banking-app/web/images/icons.svg#icon-name"></use></svg> -->

<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">

  <!-- Dashboard Icon -->
  <symbol id="icon-dashboard" viewBox="0 0 24 24">
    <rect x="3" y="3" width="9" height="9" fill="currentColor"/>
    <rect x="12" y="3" width="9" height="9" fill="currentColor"/>
    <rect x="3" y="12" width="9" height="9" fill="currentColor"/>
    <rect x="12" y="12" width="9" height="9" fill="currentColor"/>
  </symbol>

  <!-- Customers Icon -->
  <symbol id="icon-customers" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4" fill="currentColor"/>
    <path d="M 6 20 Q 6 14 12 14 Q 18 14 18 20" fill="currentColor"/>
    <path d="M 2 20 Q 2 16 5 14" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M 22 20 Q 22 16 19 14" fill="none" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- Employees Icon -->
  <symbol id="icon-employees" viewBox="0 0 24 24">
    <circle cx="12" cy="7" r="3" fill="currentColor"/>
    <path d="M 4 22 L 4 18 Q 4 14 12 14 Q 20 14 20 18 L 20 22" fill="currentColor"/>
  </symbol>

  <!-- Packages Icon -->
  <symbol id="icon-packages" viewBox="0 0 24 24">
    <path d="M 3 7 L 12 2 L 21 7 L 21 17 Q 21 20 12 22 Q 3 20 3 17 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="3" y1="7" x2="12" y2="12" stroke="currentColor" stroke-width="2"/>
    <line x1="21" y1="7" x2="12" y2="12" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- Shifts Icon -->
  <symbol id="icon-shifts" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="12" y1="12" x2="12" y2="5" stroke="currentColor" stroke-width="2"/>
    <line x1="12" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- Transactions Icon -->
  <symbol id="icon-transactions" viewBox="0 0 24 24">
    <path d="M 3 12 L 21 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M 18 9 L 21 12 L 18 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 6 15 L 3 12 L 6 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Payments Icon -->
  <symbol id="icon-payments" viewBox="0 0 24 24">
    <rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="2" y1="8" x2="22" y2="8" stroke="currentColor" stroke-width="2"/>
    <circle cx="18" cy="14" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- Reports Icon -->
  <symbol id="icon-reports" viewBox="0 0 24 24">
    <rect x="3" y="2" width="18" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="7" y1="6" x2="17" y2="6" stroke="currentColor" stroke-width="1.5"/>
    <line x1="7" y1="10" x2="17" y2="10" stroke="currentColor" stroke-width="1.5"/>
    <line x1="7" y1="14" x2="13" y2="14" stroke="currentColor" stroke-width="1.5"/>
    <line x1="7" y1="18" x2="11" y2="18" stroke="currentColor" stroke-width="1.5"/>
  </symbol>

  <!-- Settings Icon -->
  <symbol id="icon-settings" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M 12 1 L 15 5 L 15 7 Q 18 8 19 11 L 23 12 L 19 13 Q 18 16 15 17 L 15 19 L 12 23 L 9 19 L 9 17 Q 6 16 5 13 L 1 12 L 5 11 Q 6 8 9 7 L 9 5 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  </symbol>

  <!-- Logout Icon -->
  <symbol id="icon-logout" viewBox="0 0 24 24">
    <path d="M 9 2 L 3 2 Q 2 2 2 3 L 2 21 Q 2 22 3 22 L 9 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path d="M 15 6 L 22 12 L 15 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="9" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- User Profile Icon -->
  <symbol id="icon-profile" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="4" fill="currentColor"/>
    <path d="M 4 22 Q 4 16 12 16 Q 20 16 20 22" fill="currentColor"/>
  </symbol>

  <!-- Edit Icon -->
  <symbol id="icon-edit" viewBox="0 0 24 24">
    <path d="M 3 17.25 L 3 21 Q 3 22 4 22 L 7.75 22 L 20.5 9.25 L 16.75 5.5 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <polyline points="21 4 20 3 3 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Delete Icon -->
  <symbol id="icon-delete" viewBox="0 0 24 24">
    <path d="M 3 6 L 5 6 L 5 20 Q 5 21 6 21 L 18 21 Q 19 21 19 20 L 19 6 L 21 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="9" x2="9" y2="17" stroke="currentColor" stroke-width="2"/>
    <line x1="12" y1="9" x2="12" y2="17" stroke="currentColor" stroke-width="2"/>
    <line x1="15" y1="9" x2="15" y2="17" stroke="currentColor" stroke-width="2"/>
    <line x1="8" y1="6" x2="16" y2="6" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- Add Icon -->
  <symbol id="icon-add" viewBox="0 0 24 24">
    <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Search Icon -->
  <symbol id="icon-search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Home Icon -->
  <symbol id="icon-home" viewBox="0 0 24 24">
    <path d="M 3 12 L 12 3 L 21 12 L 21 19 Q 21 20 20 20 L 4 20 Q 3 20 3 19 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M 9 20 L 9 14 Q 9 12 11 12 L 13 12 Q 15 12 15 14 L 15 20" fill="none" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- Check Icon -->
  <symbol id="icon-check" viewBox="0 0 24 24">
    <polyline points="20 6 9 17 4 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Close/X Icon -->
  <symbol id="icon-close" viewBox="0 0 24 24">
    <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

  <!-- Alert Icon -->
  <symbol id="icon-alert" viewBox="0 0 24 24">
    <path d="M 12 2 L 22 20 Q 23 22 21 22 L 3 22 Q 1 22 2 20 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <line x1="12" y1="9" x2="12" y2="13" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="17" r="1" fill="currentColor"/>
  </symbol>

  <!-- Money Icon -->
  <symbol id="icon-money" viewBox="0 0 24 24">
    <rect x="2" y="5" width="20" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="2" y1="8" x2="22" y2="8" stroke="currentColor" stroke-width="1"/>
  </symbol>

  <!-- Calendar Icon -->
  <symbol id="icon-calendar" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2"/>
    <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2"/>
    <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- Download Icon -->
  <symbol id="icon-download" viewBox="0 0 24 24">
    <path d="M 21 15 L 21 19 Q 21 20 20 20 L 4 20 Q 3 20 3 19 L 3 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <polyline points="7 10 12 15 17 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="12" y1="4" x2="12" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

</svg>
